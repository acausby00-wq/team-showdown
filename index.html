<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emerald City Sales - October</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Cinzel:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f0faf5;--card:#fff;--surf:#f4faf7;--lift:#e8f5ef;--orange:#059669;--orange2:#047857;--purple:#0d9488;--green:#10b981;
--text:#0d2b1f;--muted:#5a8a70;--soft:rgba(5,150,105,.13);--mid:rgba(5,150,105,.24);--shadow:rgba(0,0,0,.08);
--g1:rgba(16,185,129,.12);--g2:rgba(45,212,191,.08);--glowc:rgba(16,185,129,.18);
--sel:linear-gradient(135deg,#f59e0b,#fbbf24);--live:linear-gradient(135deg,#059669,#0d9488);--chip:linear-gradient(90deg,#d97706,#f59e0b);--chiptext:#fff;--warn:#f59e0b;
--fd:'Cinzel',serif;--fh:'Cinzel',serif;--fb:'Outfit',sans-serif;--r:10px;--rl:16px}
[data-theme="dark"]{--bg:#0b120f;--card:#111c17;--surf:#16241e;--lift:#1d2e26;--orange:#34d399;--orange2:#6ee7b7;--purple:#2dd4bf;--text:#f1f5f9;--muted:#94a3b8;--soft:rgba(52,211,153,.15);--mid:rgba(52,211,153,.3);--shadow:rgba(0,0,0,.4)}
/* October-only Halloween theme */
body.halloween{--bg:#0d0a14;--card:#171122;--surf:#1f1730;--lift:#2a1d40;--orange:#ff7a1a;--orange2:#ffa24d;--purple:#a855f7;--green:#7cff6b;
--text:#f5efe6;--muted:#a99bbd;--soft:rgba(255,122,26,.18);--mid:rgba(255,122,26,.38);--shadow:rgba(0,0,0,.4);
--g1:rgba(168,85,247,.22);--g2:rgba(255,122,26,.18);--glowc:rgba(255,122,26,.25);
--sel:linear-gradient(135deg,#ff7a1a,#ffa24d);--live:linear-gradient(135deg,#6d28d9,#a855f7);--chip:linear-gradient(90deg,#ff7a1a,#ffa24d);--chiptext:#150d05;--warn:#ffa24d;--fh:'Creepster','Cinzel',cursive}
body.halloween .title{font-size:44px;letter-spacing:.06em}
body.halloween .hero::after{content:'🎃'}
.hw{display:none}body.halloween .hw{display:inline}
.row{display:flex;gap:8px;align-items:center}
.btn{background:var(--card);border:1px solid var(--mid);color:var(--text);border-radius:var(--r);padding:7px 16px;font-family:var(--fb);font-size:13px;cursor:pointer}
html,body{height:100%}
body{font-family:var(--fb);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;overflow:hidden;
background-image:radial-gradient(ellipse 55% 40% at 12% -5%,var(--g1),transparent 60%),radial-gradient(ellipse 45% 35% at 90% 100%,var(--g2),transparent 60%)}
.app{max-width:1800px;width:96%;height:100vh;margin:0 auto;padding:18px 0;display:flex;flex-direction:column}
.hero{position:relative;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;margin-bottom:12px;background:linear-gradient(135deg,var(--card) 55%,var(--lift));border:1px solid var(--mid);border-radius:var(--rl);overflow:hidden;box-shadow:0 4px 20px var(--shadow),0 0 28px var(--glowc);flex:0 0 auto}
.hero::after{content:none;position:absolute;right:150px;top:-14px;font-size:90px;opacity:.12;pointer-events:none}
.eyebrow{font-family:var(--fd);font-size:11px;letter-spacing:.3em;color:var(--orange2);text-transform:uppercase;margin-bottom:4px}
.title{font-family:var(--fh);font-size:32px;letter-spacing:.06em;line-height:1.1}
.title .gr{background:linear-gradient(90deg,var(--orange),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:14px;color:var(--muted);margin-top:4px}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;position:relative;z-index:1}
.month-selector{appearance:none;background:var(--sel);color:#150d05;border:none;border-radius:20px;padding:6px 20px;font-family:var(--fd);font-size:12px;font-weight:700;letter-spacing:.14em;cursor:pointer;text-transform:uppercase;outline:none}
.period-tag{font-family:var(--fd);font-size:12px;letter-spacing:.14em;background:var(--surf);border:1px solid var(--soft);color:var(--muted);padding:6px 18px;border-radius:20px;font-weight:600;display:flex;align-items:center;gap:8px}
.period-tag.live{background:var(--live);color:#fff;border:none}
.dot{width:10px;height:10px;background:#fff;border-radius:50%;animation:pulse 2s infinite;display:none}
.live .dot{display:block}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}


.err,.warn{display:none;gap:10px;border-radius:var(--r);padding:8px 18px;margin-bottom:10px;font-size:13px;font-weight:500;flex:0 0 auto}
.err{background:#3b1219;border:1px solid #dc2626;color:#fca5a5}.warn{background:#3a2a0b;border:1px solid #d97706;color:#fcd34d}
.err.show,.warn.show{display:flex}

.grid{display:grid;grid-template-columns:32% 66%;grid-template-rows:minmax(0,1fr);justify-content:space-between;gap:16px;flex:1 1 auto;min-height:0}
@media(max-width:1200px){.grid{grid-template-columns:1fr}}
.side,.main{display:flex;flex-direction:column;min-height:0;gap:12px}
.card{background:var(--card);border:1px solid var(--soft);border-radius:var(--rl);padding:14px 20px;display:flex;flex-direction:column;flex:0 0 auto;min-height:0;box-shadow:0 4px 14px var(--shadow)}
.card.flex{flex:1 1 auto}
.chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;border-bottom:1px solid var(--soft);padding-bottom:6px}
.lbl{font-family:var(--fd);font-size:12px;letter-spacing:.22em;color:var(--orange2);text-transform:uppercase}
.fsb{background:var(--surf);border:1px solid var(--soft);color:var(--muted);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:15px}
.card:fullscreen{padding:48px 56px;background:var(--bg)}.card:fullscreen table{font-size:1.2em}

.teams{display:grid;gap:10px}
.team{background:var(--surf);border:1px solid var(--soft);border-radius:var(--rl);padding:12px 18px;position:relative;overflow:hidden}
.team.first{border-color:var(--orange);box-shadow:0 0 18px var(--glowc)}
.team::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--purple)}.team.first::before{background:linear-gradient(90deg,var(--orange),var(--orange2))}
.tl{font-family:var(--fd);font-size:11px;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
.tn{font-family:var(--fd);font-size:16px;font-weight:600;margin:4px 0}
.ts{font-size:32px;font-weight:300;line-height:1}.first .ts{color:var(--orange2)}
.chip{display:inline-block;font-family:var(--fd);font-size:10px;letter-spacing:.2em;background:var(--chip);color:var(--chiptext);padding:4px 14px;border-radius:20px;font-weight:700;margin-top:8px}
.note{font-size:13px;color:var(--muted);margin-top:8px}

.tw{flex:1 1 auto;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--mid) transparent}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:8px 10px;font-family:var(--fd);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);background:var(--surf);border-bottom:1px solid var(--soft);white-space:nowrap;position:sticky;top:0;z-index:1}
th.c,td.c{text-align:center}
td{padding:8px 10px;border-bottom:1px solid var(--soft);vertical-align:middle}
tr:last-child td{border-bottom:none}
.rb{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-weight:600;background:var(--lift);color:var(--muted)}
.rb.g{background:linear-gradient(135deg,#d97706,#fbbf24);color:#fff}.rb.s{background:linear-gradient(135deg,#6b7280,#9ca3af);color:#fff}.rb.b{background:linear-gradient(135deg,#b45309,#d97706);color:#fff}
.pill{display:inline-block;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600}
.pg{background:rgba(124,255,107,.12);color:var(--green);border:1px solid rgba(124,255,107,.35)}.py{background:rgba(255,162,77,.12);color:var(--warn);border:1px solid rgba(255,162,77,.35)}.pr{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.35)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:10px;font-family:var(--fd)}
.t-dom{background:rgba(168,85,247,.15);color:#c084fc;border:1px solid rgba(168,85,247,.4)}.t-clove{background:rgba(255,122,26,.15);color:var(--warn);border:1px solid rgba(255,122,26,.4)}
.cg{color:var(--green);font-weight:500}.cy{color:var(--warn);font-weight:500}.cr{color:#f87171;font-weight:500}
.g125{color:var(--orange);font-weight:600;font-size:11px}
.focus,.gap{color:#f87171;font-weight:600}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div>
      <div class="eyebrow">Connectivity Source &mdash; Emerald City</div>
      <h1 class="title"><span class="hw">🎃 </span>Greenwood <span class="gr">Sales</span><span class="hw"> 👻</span></h1>
      <div class="sub">The Vipers (Team Dom) &middot; The Phantoms (Team Clove)</div>
    </div>
    <div class="hero-right">
      <div class="row"><select id="month-selector" class="month-selector" onchange="fetchData()"></select><button class="btn" id="theme-toggle" onclick="toggleTheme()">🌙 Dark</button></div>
      <span class="period-tag" id="period-tag"><div class="dot"></div><span id="sync-label">Loading Data...</span></span>
    </div>
  </header>


  <div class="err" id="err">⚠ <span>Couldn't reach the live data source. Check Google Sheet sharing permissions.</span></div>
  <div class="warn" id="warn">⚠ <span id="warn-text"></span></div>

  <div class="grid">
    <div class="side" id="side"></div>
    <div class="main" id="main"></div>
  </div>
</div>

<script>
/* ===== CONFIG ===== */
const SHEET_ID = "14NRqBdyJUhgyLaszqpiRjxiE7oIOx-kpXpF-7KMvdFI";
const OCT_GID = "1979567923"; // October Actuals tab
const csv = gid => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;

const MONTH_DATA = [
  { label: "October 2026 (Live)",  dataUrl: csv(1979567923),     isLive: true, theme: "halloween" },
  { label: "August 2026 (Final)",  dataUrl: csv("2037911790"), isLive: false },
  { label: "July 2026 (Final)",    dataUrl: csv("333252067"),  isLive: false },
  { label: "June 2026 (Final)",    dataUrl: csv("0"),          isLive: false }
];
const LIVE_GOALS_URL = csv("1502188895");

const METRIC_DEFS = [
  {key:"Postpaid Voice",weight:17.5,unit:"",isVol:true},{key:"BTS",weight:17.5,unit:"",isVol:true},
  {key:"HSI",weight:12.5,unit:"",isVol:true},{key:"APK",weight:5,unit:"",isVol:false},
  {key:"CSAT",weight:10,unit:"",isVol:false},{key:"Visa App Rate",weight:12.5,unit:"%",isVol:false},
  {key:"Premium Mix",weight:12.5,unit:"%",isVol:false},{key:"VAF",weight:12.5,unit:"$",isVol:false},
  {key:"P360",weight:12.5,unit:"%",isVol:false}
];
const FALLBACK_GOALS = {
  "Postpaid Voice":{goal:20,teamGoal:95,teamGoal125:119},"BTS":{goal:16,teamGoal:64,teamGoal125:80},
  "HSI":{goal:8,teamGoal:29,teamGoal125:36},"APK":{goal:2.0,teamGoal:2.0,teamGoal125:2.5},
  "CSAT":{goal:9.2,teamGoal:9.2,teamGoal125:11.5},"Visa App Rate":{goal:7.5,teamGoal:7.5,teamGoal125:9.3},
  "Premium Mix":{goal:80,teamGoal:80,teamGoal125:100},
  "VAF":{goal:19,teamGoal:19,teamGoal125:21}, // TODO: replace 0s with real VAF targets
  "P360":{goal:40,teamGoal:40,teamGoal125:50}
};
const TEAM_NAMES = {"Team Dom":{display:"The Vipers",og:"Team Dom"},"Team Clove":{display:"The Phantoms",og:"Team Clove"}};

/* ===== STATE ===== */
let METRICS = METRIC_DEFS.map(d => ({...d, ...FALLBACK_GOALS[d.key]}));
let liveGoals = {}, repsData = [];
const $ = id => document.getElementById(id);

window.addEventListener('DOMContentLoaded', () => {
  $('month-selector').innerHTML = MONTH_DATA.map((m,i) => `<option value="${i}">${m.label}</option>`).join("");
  fetchData();
  setInterval(fetchData, 300000);
});

function applyTheme(src) {
  const hw = src.theme === 'halloween';
  document.body.classList.toggle('halloween', hw);
  $('theme-toggle').style.display = hw ? 'none' : '';
}
function toggleTheme() {
  const h = document.documentElement, t = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  h.setAttribute('data-theme', t);
  try { localStorage.setItem('ec_theme', t); } catch (e) {}
  $('theme-toggle').textContent = t === 'dark' ? '☀️ Light' : '🌙 Dark';
}
(function () { try { if (localStorage.getItem('ec_theme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); window.addEventListener('DOMContentLoaded', () => $('theme-toggle').textContent = '☀️ Light'); } } catch (e) {} })();

function updateSyncUI(ok, src, fellBack, keys) {
  const tag = $('period-tag'), label = $('sync-label');
  $('warn').classList.toggle('show', !!fellBack && ok);
  if (fellBack && ok) $('warn-text').textContent = keys && keys.length
    ? `Couldn't read live targets for: ${keys.join(", ")} — showing fallback numbers for those metrics only.`
    : `Couldn't reach the live Store & Rep Goals sheet — showing fallback numbers, not today's real targets.`;
  if (!ok) { tag.classList.remove('live'); label.textContent = 'Sync Failed'; $('err').classList.add('show'); return; }
  $('err').classList.remove('show');
  if (src.isLive) { tag.classList.add('live'); label.textContent = `Live Sync · Updated ${new Date().toLocaleString('en-US',{hour:'numeric',minute:'2-digit'})}`; }
  else { tag.classList.remove('live'); label.textContent = 'Archived Data · Static View'; }
}

/* ===== FETCH ===== */
async function fetchData() {
  const src = MONTH_DATA[$('month-selector').value];
  applyTheme(src);
  let fellBack = false;
  try {
    const [dataRes, goalsRes] = await Promise.all([fetch(src.dataUrl), src.isLive ? fetch(LIVE_GOALS_URL) : Promise.resolve(null)]);
    if (src.isLive) {
      if (goalsRes && goalsRes.ok && !(goalsRes.headers.get("content-type")||"").includes("text/html")) parseGoals(await goalsRes.text());
      else fellBack = true;
    }
    METRICS = buildMetrics(src.isLive);
    let keys = [];
    if (src.isLive) { keys = METRICS.filter(m => m._fb).map(m => m.key); if (keys.length) fellBack = true; }
    if (!dataRes.ok || (dataRes.headers.get("content-type")||"").includes("text/html")) throw new Error("Data sheet restricted or invalid URL.");
    parseData(await dataRes.text());
    updateSyncUI(true, src, fellBack, keys);
  } catch (e) { console.error(e); updateSyncUI(false, src, fellBack); }
}

function parseLine(line) {
  const cols = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { if (q && line[i+1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (ch === ',' && !q) { cols.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  cols.push(cur.trim()); return cols;
}

function parseGoals(text) {
  const rows = text.split('\n').map(parseLine), next = {};
  const hdr = [
    [/postpaid\s*voice/i,"Postpaid Voice"],[/bts/i,"BTS"],[/hsi/i,"HSI"],[/value\s*added\s*features|vaf/i,"VAF"],
    [/premium\s*(rate\s*plan\s*)?mix/i,"Premium Mix"],[/apk/i,"APK"],[/csat/i,"CSAT"],[/visa/i,"Visa App Rate"],[/p360/i,"P360"]
  ];
  for (let r = 0; r < rows.length; r++) for (let c = 0; c < rows[r].length; c++) {
    const cell = rows[r][c]; if (!cell) continue;
    hdr.forEach(([re, key]) => {
      if (!re.test(cell)) return;
      // Row 10 holds store totals; fall back to the row under the header
      let v = (rows.length >= 10 && rows[9]) ? parseFloat(rows[9][c]) : NaN;
      if (isNaN(v) && rows[r+1]) v = parseFloat(rows[r+1][c]);
      if (!isNaN(v)) { next[key] = next[key] || {}; next[key].teamGoal = v; next[key].teamGoal125 = v * 1.25; }
    });
  }
  const lab = [[/^voice$/i,"Postpaid Voice"],[/^bts$/i,"BTS"],[/^hsi$/i,"HSI"],[/^accessories$/i,"APK"],[/^csat$/i,"CSAT"],[/^visa$/i,"Visa App Rate"],[/^p360$/i,"P360"]];
  for (let r = 0; r < rows.length; r++) for (let c = 0; c < rows[r].length; c++) {
    const cell = (rows[r][c]||'').trim(); if (!cell) continue;
    const m = lab.find(([re]) => re.test(cell)); if (!m) continue;
    const v = parseFloat(rows[r][c+1]);
    if (!isNaN(v)) { next[m[1]] = next[m[1]] || {}; next[m[1]].goal = v; }
  }
  Object.keys(next).forEach(k => { if (next[k].goal === undefined && next[k].teamGoal !== undefined) next[k].goal = next[k].teamGoal; });
  if (Object.keys(next).length) liveGoals = next;
}

function buildMetrics(isLive) {
  return METRIC_DEFS.map(d => {
    const s = isLive ? (liveGoals[d.key] || {}) : {}, fb = FALLBACK_GOALS[d.key];
    return {...d, goal: s.goal ?? fb.goal, teamGoal: s.teamGoal ?? fb.teamGoal, teamGoal125: s.teamGoal125 ?? fb.teamGoal125, _fb: isLive && s.goal === undefined};
  });
}

function parseData(text) {
  const rows = text.trim().split('\n'), headers = parseLine(rows[0]);
  repsData = [];
  for (let i = 1; i < rows.length; i++) {
    if (!rows[i].trim()) continue;
    const cols = parseLine(rows[i]), rep = {name: cols[0], team: cols[1], data: {}};
    METRICS.forEach(m => { const ix = headers.indexOf(m.key); rep.data[m.key] = ix > -1 ? (parseFloat(cols[ix]) || 0) : 0; });
    if (rep.name && rep.team) repsData.push(processRep(rep));
  }
  repsData.sort((a,b) => b.composite - a.composite);
  render();
}

const getWeights = () => { const t = METRICS.reduce((a,b) => a + b.weight, 0) || 1; return METRICS.map(m => m.weight / t); };

function processRep(raw) {
  const w = getWeights(); let composite = 0, low = Infinity, focusArea = "", focusGap = 0; const mp = {};
  METRICS.forEach((m,i) => {
    const val = raw.data[m.key], pct = m.goal > 0 ? (val / m.goal) * 100 : 0;
    composite += pct * w[i]; mp[m.key] = {pct, val, goal: m.goal};
    if (pct < low) { low = pct; focusArea = m.key; focusGap = m.goal - val; }
  });
  return {name: raw.name, team: raw.team, composite, focusArea, focusGap, mp};
}

/* ===== HELPERS ===== */
const pillCls = s => s >= 100 ? "pg" : s >= 80 ? "py" : "pr";
const colorCls = p => p >= 100 ? "cg" : p >= 80 ? "cy" : "cr";
const rbadge = i => `<span class="rb ${["g","s","b"][i] || ""}">${i+1}</span>`;
const teamTag = t => `<span class="tag ${t==="Team Dom"?"t-dom":"t-clove"}">${TEAM_NAMES[t] ? TEAM_NAMES[t].display : t}</span>`;
const teamFull = t => { const n = TEAM_NAMES[t] || {display:t, og:t}; return `${n.display} <span style="font-size:11px;color:var(--muted)">(${n.og})</span>`; };
function fmt(v, unit) {
  if (v === undefined || v === null || isNaN(v)) return v;
  return unit === "$" ? `$${Number(v).toLocaleString('en-US',{maximumFractionDigits:2})}` : `${v}${unit||""}`;
}
const head = (title, id) => `<div class="chead"><div class="lbl">${title}</div><button class="fsb" onclick="fs('${id}')" title="Full screen">⛶</button></div>`;
const th125 = m => `<th class="c">${m.key}<br><span class="g125">(125%: ${fmt(m.teamGoal125, m.unit)})</span></th>`;

/* ===== RENDER ===== */
function render() {
  if (!repsData.length) return;
  const w = getWeights(), teams = {}, store = {};
  repsData.forEach(r => {
    teams[r.team] = teams[r.team] || {reps: [], sum: {}};
    teams[r.team].reps.push(r);
    METRICS.forEach(m => {
      teams[r.team].sum[m.key] = (teams[r.team].sum[m.key] || 0) + r.mp[m.key].val;
      store[m.key] = (store[m.key] || 0) + r.mp[m.key].val;
    });
  });
  const tArr = Object.keys(teams).map(t => {
    const tm = teams[t], mt = {}; let avg = 0;
    METRICS.forEach((m,i) => {
      const actual = m.isVol ? tm.sum[m.key] : tm.sum[m.key] / tm.reps.length;
      mt[m.key] = m.teamGoal > 0 ? (actual / m.teamGoal) * 100 : 0; avg += mt[m.key] * w[i];
    });
    return {name: t, avg, mt};
  }).sort((a,b) => b.avg - a.avg);

  let h = `<div class="card" id="c-teams">${head("Team Standings","c-teams")}<div class="teams">`;
  tArr.forEach((t,i) => {
    h += `<div class="team ${i===0?"first":""}"><div class="tl">Team</div><div class="tn">${teamFull(t.name)}</div><div class="ts">${t.avg.toFixed(1)}<span style="font-size:24px">%</span></div>${i===0?`<span class="chip">👑 LEADING</span>`:`<div class="note">#2 this period</div>`}</div>`;
  });
  h += `</div></div>`;

  h += `<div class="card" id="c-store">${head("Full Store — Actual vs Target","c-store")}<div class="tw"><table><thead><tr><th>Store</th>${METRICS.map(th125).join("")}</tr></thead><tbody><tr><td><strong>Greenwood Total</strong></td>`;
  METRICS.forEach(m => {
    const raw = m.isVol ? (store[m.key] || 0) : (store[m.key] || 0) / repsData.length, actual = Math.round(raw * 10) / 10;
    const pct = m.teamGoal > 0 ? (actual / m.teamGoal) * 100 : 0;
    h += `<td class="c"><span class="${colorCls(pct)}">${pct.toFixed(1)}%</span><br><span class="g125">${fmt(actual, m.unit)} / ${fmt(m.teamGoal, m.unit)}</span></td>`;
  });
  h += `</tr></tbody></table></div></div>`;

  h += `<div class="card flex" id="c-break">${head("Team Metric Breakdown (% to Target)","c-break")}<div class="tw"><table><thead><tr><th>Team</th>${METRICS.map(th125).join("")}</tr></thead><tbody>`;
  tArr.forEach(t => {
    h += `<tr><td><strong>${teamFull(t.name)}</strong></td>${METRICS.map(m => `<td class="c"><span class="${colorCls(t.mt[m.key])}">${t.mt[m.key].toFixed(1)}%</span></td>`).join("")}</tr>`;
  });
  h += `</tbody></table></div></div>`;
  $("side").innerHTML = h;

  let i2 = `<div class="card flex" id="c-ind" style="height:100%">${head("Individual Leaderboard","c-ind")}<div class="tw"><table><thead><tr><th>#</th><th>Name</th><th>Team</th><th class="c">Composite</th>${METRICS.map(m => `<th class="c">${m.key}</th>`).join("")}<th>Focus Area</th><th>Gap</th></tr></thead><tbody>`;
  repsData.forEach((r,i) => {
    i2 += `<tr><td>${rbadge(i)}</td><td style="font-size:16px"><strong>${r.name}</strong></td><td>${teamTag(r.team)}</td><td class="c"><span class="pill ${pillCls(r.composite)}">${r.composite.toFixed(1)}%</span></td>`;
    METRICS.forEach(m => { const p = r.mp[m.key]; i2 += `<td class="c"><span class="${colorCls(p.pct)}">${fmt(p.val, m.unit)}</span><br><span class="g125">/ ${fmt(p.goal, m.unit)}</span></td>`; });
    i2 += `<td class="focus">${r.focusArea}</td><td class="gap">${r.focusGap > 0 ? "-" + r.focusGap.toFixed(1) : "On track"}</td></tr>`;
  });
  i2 += `</tbody></table></div></div>`;
  $("main").innerHTML = i2;
}

/* ===== FULLSCREEN ===== */
function fs(id) {
  const el = $(id); if (!el) return;
  const cur = document.fullscreenElement || document.webkitFullscreenElement;
  if (cur === el) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
}
function fsChange() {
  const cur = document.fullscreenElement || document.webkitFullscreenElement;
  document.querySelectorAll('.fsb').forEach(b => { const c = b.closest('.card'); b.textContent = (c && c === cur) ? '✕' : '⛶'; });
}
document.addEventListener('fullscreenchange', fsChange);
document.addEventListener('webkitfullscreenchange', fsChange);
</script>
</body>
</html>
